name: Build BGFX

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated list of platforms to build or "all". Supported: win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64, android-arm, android-arm64, android-x86, android-x64, android-vulkan-arm, android-vulkan-arm64, android-vulkan-x86, android-vulkan-x64, browser-wasm, ios-arm64, ios-simulator'
        default: 'all'
        required: false
      configurations:
        description: 'Comma-separated list of configurations to build (Debug,Release) or "all"'
        default: 'all'
        required: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix_include: ${{ steps.parse.outputs.matrix_include }}
    steps:
      - id: parse
        run: |
          full_mapping='{
            "win-x64": "windows-latest",
            "linux-x64": "ubuntu-latest",
            "linux-arm64": "ubuntu-24.04-arm",
            "osx-x64": "macos-latest",
            "osx-arm64": "macos-latest",
            "android-arm": "ubuntu-latest",
            "android-arm64": "ubuntu-latest",
            "android-x86": "ubuntu-latest",
            "android-x64": "ubuntu-latest",
            "android-vulkan-arm": "ubuntu-latest",
            "android-vulkan-arm64": "ubuntu-latest",
            "android-vulkan-x86": "ubuntu-latest",
            "android-vulkan-x64": "ubuntu-latest",
            "browser-wasm": "ubuntu-latest",
            "ios-arm64": "macos-latest",
            "ios-simulator": "macos-latest"
          }'
          
          targets_input="${{ inputs.targets }}"
          if [ "$targets_input" = "all" ] || [ -z "$targets_input" ]; then
            selected_targets=$(echo "$full_mapping" | jq -c 'keys')
          else
            selected_targets=$(echo "$targets_input" | jq -c -R 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')
          fi
          
          configs_input="${{ inputs.configurations }}"
          if [ "$configs_input" = "all" ] || [ -z "$configs_input" ]; then
            configs='["Debug", "Release"]'
          else
            configs=$(echo "$configs_input" | jq -c -R 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')
          fi
          
          matrix_include=$(echo "$full_mapping" | jq -c --argjson targets "$selected_targets" --argjson configs "$configs" '
            [
              $targets[] as $t |
              $configs[] as $c |
              {target: $t, configuration: $c, os: .[$t]}
            ]
          ')
          
          echo "matrix_include=$matrix_include" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target }} (${{ matrix.configuration }})
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix_include) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Emscripten
        if: matrix.target == 'browser-wasm'
        uses: emscripten-core/setup-emsdk@v11

      - name: Install Linux Dependencies
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libxext-dev

      - name: Clean native-src
        shell: pwsh
        run: |
          if (Test-Path native-src) {
            Remove-Item -Recurse -Force native-src
          }

      - name: Build
        run: dotnet run scripts/build-bgfx.cs -- --target ${{ matrix.target }} --configuration ${{ matrix.configuration }} --source-root native-src --generator vs2022

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bgfx-${{ matrix.target }}-${{ matrix.configuration }}
          path: native/bgfx/bin/

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Release Name
        id: vars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha_short=$(echo ${{ github.sha }} | cut -c1-7)
          
          # Count releases
          release_count=$(gh release list --limit 1000 | wc -l)
          build_number=$((release_count + 1))
          
          timestamp=$(date +%s)
          date_human=$(date +'%Y-%m-%d')
          time_human=$(date +'%r')
          
          release_name="${build_number}-${sha_short}-${timestamp}"
          tag_name="build-${release_name}"
          
          echo "release_name=${release_name}" >> $GITHUB_OUTPUT
          echo "tag_name=${tag_name}" >> $GITHUB_OUTPUT
          
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "Build Number: ${build_number}" >> $GITHUB_OUTPUT
          echo "For commit: ${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "Unix timestamp: ${timestamp}" >> $GITHUB_OUTPUT
          echo "Date: ${date_human}" >> $GITHUB_OUTPUT
          echo "Time: ${time_human}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Zip Artifacts
        run: |
          cd artifacts
          for d in bgfx-*; do
            if [ -d "$d" ]; then
              zip -r "${d}.zip" "$d"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          body: ${{ steps.vars.outputs.body }}
          files: artifacts/*.zip
          draft: false
          prerelease: false
