name: Build SDL3

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Comma-separated list of platforms to build or "all". Supported: win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64, android-x86, android-x64, android-arm64, android-arm7, ios-arm64, windows-gdk, emscripten, steamos, tvos'
        default: 'all'
        required: false
      configurations:
        description: 'Comma-separated list of configurations to build (Debug,Release) or "all"'
        default: 'all'
        required: false

jobs:
  setup:
    # Note: ubuntu-latest currently maps to ubuntu-24.04
    runs-on: ubuntu-latest
    outputs:
      matrix_include: ${{ steps.parse.outputs.matrix_include }}
    steps:
      - id: parse
        # NOTE on Runner 'latest' mappings at time of setup:
        # - ubuntu-latest currently maps to ubuntu-24.04
        # - windows-latest currently maps to windows-2025
        # - macos-latest currently maps to macos-14
        run: |
          full_mapping='{
            "win-x64": {"runner": "windows-latest"},
            "win-arm64": {"runner": "windows-latest"},
            "linux-x64": {"runner": "ubuntu-latest", "container": "ubuntu:20.04"},
            "linux-arm64": {"runner": "ubuntu-24.04-arm", "container": "ubuntu:20.04"},
            "osx-x64": {"runner": "macos-latest"},
            "osx-arm64": {"runner": "macos-latest"},
            "android-x86": {"runner": "ubuntu-latest"},
            "android-x64": {"runner": "ubuntu-latest"},
            "android-arm64": {"runner": "ubuntu-latest"},
            "android-arm7": {"runner": "ubuntu-latest"},
            "ios-arm64": {"runner": "macos-latest"},
            "windows-gdk": {"runner": "windows-latest"},
            "emscripten": {"runner": "ubuntu-latest"},
            "steamos": {"runner": "ubuntu-latest"},
            "tvos": {"runner": "macos-latest"}
          }'
          
          targets_input="${{ inputs.targets }}"
          if [ "$targets_input" = "all" ] || [ -z "$targets_input" ]; then
            selected_targets=$(echo "$full_mapping" | jq -c 'keys')
          else
            selected_targets=$(echo "$targets_input" | jq -c -R 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')
          fi
          
          configs_input="${{ inputs.configurations }}"
          if [ "$configs_input" = "all" ] || [ -z "$configs_input" ]; then
            configs='["Debug", "Release"]'
          else
            configs=$(echo "$configs_input" | jq -c -R 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')
          fi
          
          matrix_include=$(echo "$full_mapping" | jq -c --argjson targets "$selected_targets" --argjson configs "$configs" '
            [
              $targets[] as $t |
              $configs[] as $c |
              {target: $t, configuration: $c, runner: .[$t].runner, container: .[$t].container}
            ]
          ')
          
          echo "matrix_include=$matrix_include" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.target }} (${{ matrix.configuration }})
    needs: setup
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix_include) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: startsWith(matrix.target, 'linux-') || matrix.target == 'steamos'
        run: |
          if command -v sudo >/dev/null; then
            SUDO="sudo"
          else
            SUDO=""
          fi
          $SUDO apt-get update
          $SUDO apt-get install -y build-essential cmake git libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxi-dev libxrandr-dev libxss-dev libxxf86vm-dev libasound2-dev libpulse-dev libdbus-1-dev libxtst-dev

      - name: Setup Emscripten
        if: matrix.target == 'emscripten'
        uses: emscripten-core/setup-emsdk@v11

      - name: Clone SDL3
        run: |
          git clone --branch main https://github.com/libsdl-org/SDL.git sdl-src

      - name: Configure CMake
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == "emscripten" ]]; then
            CMAKE_ARGS="-DSDL_STATIC=ON -DSDL_SHARED=OFF"
          else
            CMAKE_ARGS="-DSDL_STATIC=OFF -DSDL_SHARED=ON"
          fi
          
          if [[ "${{ matrix.target }}" == "osx-arm64" ]]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_OSX_ARCHITECTURES=arm64"
          elif [[ "${{ matrix.target }}" == "osx-x64" ]]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_OSX_ARCHITECTURES=x86_64"
          elif [[ "${{ matrix.target }}" == "win-arm64" ]]; then
            CMAKE_ARGS="$CMAKE_ARGS -A ARM64"
          elif [[ "${{ matrix.target }}" == android-* ]]; then
            ABI=""
            if [[ "${{ matrix.target }}" == "android-arm64" ]]; then ABI="arm64-v8a"
            elif [[ "${{ matrix.target }}" == "android-arm7" ]]; then ABI="armeabi-v7a"
            elif [[ "${{ matrix.target }}" == "android-x64" ]]; then ABI="x86_64"
            elif [[ "${{ matrix.target }}" == "android-x86" ]]; then ABI="x86"
            fi
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=$ABI"
          elif [[ "${{ matrix.target }}" == "ios-arm64" ]]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_SYSTEM_NAME=iOS"
          elif [[ "${{ matrix.target }}" == "tvos" ]]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_SYSTEM_NAME=tvOS"
          elif [[ "${{ matrix.target }}" == "visionos" ]]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_SYSTEM_NAME=visionOS"
          elif [[ "${{ matrix.target }}" == "emscripten" ]]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_TOOLCHAIN_FILE=$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake"
          elif [[ "${{ matrix.target }}" == "windows-gdk" ]]; then
            CMAKE_ARGS="$CMAKE_ARGS -DSDL_GDK=ON"
          fi
          
          GENERATOR_ARGS=""
          if [[ "${{ matrix.target }}" == osx-* ]] || [[ "${{ matrix.target }}" == "ios-arm64" ]] || [[ "${{ matrix.target }}" == "tvos" ]]; then
            GENERATOR_ARGS="-G Xcode"
            # Disable code signing and tests for CI on Apple platforms
            CMAKE_ARGS="$CMAKE_ARGS -DSDL_TESTS=OFF -DSDL_TEST=OFF -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY='' -DCMAKE_XCODE_ATTRIBUTE_PRODUCT_MODULE_NAME=SDL3"
          fi
          
          cmake -S sdl-src -B build $GENERATOR_ARGS $CMAKE_ARGS -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}

      - name: Build
        run: |
          cmake --build build --config ${{ matrix.configuration }}

      - name: Flatten Artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Find all binaries and copy them flatly into dist/
          find build -type f \( -name "*.dll" -o -name "*.so*" -o -name "*.dylib" -o -name "*.js" -o -name "*.wasm" -o -name "*.a" \) -exec cp {} dist/ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdl3-${{ matrix.target }}-${{ matrix.configuration }}
          path: dist/

  release:
    name: Create Release
    needs: build
    # Note: ubuntu-latest currently maps to ubuntu-24.04
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Release Name
        id: vars
        run: |
          timestamp=$(date +%s)
          date_human=$(date +'%Y-%m-%d')
          
          release_name="sdl-deps-${{ github.run_number }}"
          tag_name="sdl-deps-${{ github.run_number }}"
          
          echo "release_name=${release_name}" >> $GITHUB_OUTPUT
          echo "tag_name=${tag_name}" >> $GITHUB_OUTPUT
          
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "This release contains the native binaries for SDL3." >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "Build Number: ${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "Date: ${date_human}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Zip Artifacts
        run: |
          cd artifacts
          for d in sdl3-*; do
            if [ -d "$d" ]; then
              zip -r "${d}.zip" "$d"
            fi
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          body: ${{ steps.vars.outputs.body }}
          files: artifacts/*.zip
          draft: false
          prerelease: true
